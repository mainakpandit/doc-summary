[pytest]
# Keep one event loop for the whole session: backend.app.db.engine is a
# module-level singleton, and its asyncpg pool binds to whichever loop
# first uses it. Per-function loops (pytest-asyncio's default) desync the
# pool from later tests' loops, which asyncpg reports as connection
# failures that read (incorrectly) as "database unreachable".
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

markers =
    integration: requires a live external service (e.g. Postgres); skip if unreachable

addopts = --cov=backend/app --cov-report=term-missing --cov-config=pytest.ini

# --cov-config points coverage.py back at this file (it does not read
# pytest.ini's [coverage:*] sections on its own), so the two sections
# below are the single source of truth for coverage settings.
[coverage:run]
branch = true

[coverage:report]
show_missing = true
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
