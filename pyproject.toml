[project]
name = "pm-analyst-backend"
version = "0.1.0"
description = "Agentic system that ingests PM documents and produces a Feature Register"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "anthropic",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "pgvector",
    "pypdf",
    "pdfplumber",
    "python-docx",
    "python-magic",
    "watchdog",
    "pyyaml",
    "httpx",
    "sse-starlette",
    "mcp",
    "structlog",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest",
    "pytest-asyncio",
    "ruff>=0.16.2",
    "testcontainers[postgres]",
    "vcrpy",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Keep one event loop for the whole session: backend.app.db.engine is a
# module-level singleton, and its asyncpg pool binds to whichever loop
# first uses it. Per-function loops (pytest-asyncio's default) desync the
# pool from later tests' loops, which asyncpg reports as connection
# failures that read (incorrectly) as "database unreachable".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: requires a live external service (e.g. Postgres); skip if unreachable",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.uv]
package = false
